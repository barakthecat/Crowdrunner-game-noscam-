<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b1712">
<!-- BEGIN ARTIFACT -->
<title>Crowd Runner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@500;700&display=swap">
<style>
  /* Layout: full-screen WebGL canvas with a slim HUD on top and a single
     centered "war banner" panel for menus. Single dark look on purpose. */
  :root {
    --ink: #1b1712;
    --panel: rgba(27, 23, 18, 0.88);
    --panel-edge: #5a4527;
    --gold: #f6c544;
    --gold-deep: #c1801b;
    --paper: #fff4dc;
    --muted: #cdbf9f;
    --blue: #2f6df6;
    --red: #e0362c;
    --green: #46c46a;
    --display: "Lilita One", "Arial Black", Impact, sans-serif;
    --body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ink); color: var(--paper); }
  body { font-family: var(--body); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* HUD */
  #hud {
    position: fixed; inset: 0 0 auto 0; z-index: 5; pointer-events: none;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--panel); border: 2px solid var(--panel-edge); border-radius: 999px;
    padding: 5px 12px; font-family: var(--display); font-size: 17px; letter-spacing: 0.02em;
    color: var(--paper); font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .coin { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff2a8, var(--gold) 45%, var(--gold-deep)); box-shadow: inset 0 0 0 1.5px #8a5a10; flex: none; }
  .hud-mid { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .progress { height: 10px; border-radius: 99px; background: rgba(27, 23, 18, 0.7); border: 2px solid var(--panel-edge); overflow: hidden; }
  #hud-progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--gold-deep), var(--gold)); }
  .hud-right { display: flex; gap: 8px; align-items: center; }
  .fp-label { color: var(--muted); font-size: 13px; }
  #quit {
    pointer-events: auto; border: 2px solid var(--panel-edge); background: var(--panel); color: var(--paper);
    width: 36px; height: 36px; border-radius: 50%; font-size: 18px; line-height: 1; cursor: pointer; display: grid; place-items: center;
  }
  #quit:focus-visible, button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  /* floating numbers */
  #popups { position: fixed; inset: 0; pointer-events: none; z-index: 4; overflow: hidden; }
  .pop {
    position: absolute; transform: translate(-50%, -50%); font-family: var(--display); font-size: 34px;
    -webkit-text-stroke: 2px #fff; paint-order: stroke fill; text-shadow: 0 3px 0 rgba(0,0,0,0.25);
    animation: rise 1s ease-out forwards; white-space: nowrap;
  }
  .pop.good { color: var(--blue); }
  .pop.bad { color: var(--red); }
  .pop.power { color: var(--gold-deep); font-size: 26px; }
  @keyframes rise { 0% { opacity: 0; transform: translate(-50%, -30%) scale(0.6); } 15% { opacity: 1; transform: translate(-50%, -60%) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -220%) scale(1); } }

  .banner {
    position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%) scale(0.6); z-index: 6; pointer-events: none;
    font-family: var(--display); font-size: clamp(54px, 18vw, 96px); color: var(--red); letter-spacing: 0.04em;
    -webkit-text-stroke: 4px #fff; paint-order: stroke fill; opacity: 0; transition: opacity .2s, transform .25s cubic-bezier(.3,1.6,.5,1);
  }
  .banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  /* overlays */
  .overlay {
    position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: center;
    padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(16px, env(safe-area-inset-left, 0px));
    background: linear-gradient(180deg, rgba(27,23,18,0) 25%, rgba(27,23,18,0.55) 60%, rgba(27,23,18,0.85));
  }
  .card {
    width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 14px;
    background: var(--panel); border: 3px solid var(--panel-edge); border-radius: 22px;
    padding: 20px 18px 18px; box-shadow: 0 18px 40px rgba(0,0,0,0.45);
  }
  .title {
    margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(42px, 13vw, 58px); line-height: 0.95; text-align: center;
    color: var(--gold); -webkit-text-stroke: 3px #3a2508; paint-order: stroke fill; text-shadow: 0 4px 0 #3a2508; letter-spacing: 0.02em; text-wrap: balance;
  }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .level-tag { font-family: var(--display); font-size: 22px; color: var(--paper); }
  .howto { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; text-align: center; text-wrap: balance; }
  .upgrades { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .up {
    display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; cursor: pointer;
    background: rgba(255, 244, 220, 0.06); border: 2px solid var(--panel-edge); border-radius: 14px; padding: 10px 12px; color: var(--paper);
    font-family: var(--body);
  }
  .up:disabled { opacity: 0.5; cursor: default; }
  .up:not(:disabled):active { transform: translateY(1px); }
  .up-name { font-family: var(--display); font-size: 18px; color: var(--gold); letter-spacing: 0.02em; }
  .up-val { font-size: 13px; color: var(--paper); }
  .up-cost { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .play {
    border: 0; cursor: pointer; border-radius: 16px; padding: 14px 18px;
    font-family: var(--display); font-size: 30px; letter-spacing: 0.04em; color: #3a2508;
    background: linear-gradient(180deg, #ffe07a, var(--gold) 50%, var(--gold-deep)); box-shadow: 0 5px 0 #7a4c0c, inset 0 2px 0 rgba(255,255,255,0.5);
  }
  .play:active { transform: translateY(3px); box-shadow: 0 2px 0 #7a4c0c, inset 0 2px 0 rgba(255,255,255,0.5); }
  .ghost { background: none; border: 0; color: var(--muted); font-family: var(--body); font-size: 13px; cursor: pointer; padding: 4px 6px; text-decoration: underline; text-underline-offset: 3px; }
  .result-title { margin: 0; font-family: var(--display); font-weight: 400; font-size: 56px; text-align: center; -webkit-text-stroke: 3px #fff; paint-order: stroke fill; letter-spacing: 0.03em; }
  .result-title.win { color: var(--blue); }
  .result-title.lose { color: var(--red); }
  .result-sub { margin: 0; text-align: center; color: var(--paper); font-size: 15px; line-height: 1.45; text-wrap: balance; }
  .result-coins { display: flex; justify-content: center; align-items: center; gap: 8px; font-family: var(--display); font-size: 28px; color: var(--gold); }
  .result-coins .coin { width: 22px; height: 22px; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 24px; color: var(--muted); z-index: 1; }
  body.ready .loading { display: none; }
  @media (prefers-reduced-motion: reduce) { .pop, .banner { animation: none; transition: none; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<!-- END HEAD -->
</head>
<body>
<canvas id="game" aria-label="Crowd Runner game"></canvas>
<div class="loading">Loading…</div>
<div id="popups"></div>
<div id="banner" class="banner"></div>

<div id="hud" hidden>
  <span class="chip" id="hud-level">Level 1</span>
  <div class="hud-mid">
    <div class="progress"><div id="hud-progress-fill"></div></div>
  </div>
  <div class="hud-right">
    <span class="chip"><span class="fp-label">DMG</span><span id="hud-fp">×1</span></span>
    <span class="chip"><span class="coin"></span><span id="hud-coins">0</span></span>
    <button id="quit" type="button" aria-label="Back to menu">✕</button>
  </div>
</div>

<div id="menu" class="overlay" hidden>
  <div class="card">
    <h1 class="title">Crowd Runner</h1>
    <div class="row">
      <span class="level-tag" id="menu-level">Level 1</span>
      <span class="chip"><span class="coin"></span><span id="menu-coins">0</span></span>
    </div>
    <p class="howto">Drag to steer. Your squad fires nonstop: shoot gates to raise their number, break barrels for loot, and save enough troops to take down the boss.</p>
    <div class="upgrades">
      <button class="up" id="up-recruits" type="button">
        <span class="up-name">Recruits</span>
        <span class="up-val" id="up-recruits-val">10 troops</span>
        <span class="up-cost"><span class="coin"></span><span id="up-recruits-cost">30</span></span>
      </button>
      <button class="up" id="up-power" type="button">
        <span class="up-name">Firepower</span>
        <span class="up-val" id="up-power-val">×1.00 damage</span>
        <span class="up-cost"><span class="coin"></span><span id="up-power-cost">30</span></span>
      </button>
    </div>
    <button class="play" id="play" type="button">Play</button>
    <div class="row" style="justify-content:center">
      <button class="ghost" id="mute" type="button" aria-pressed="true">Sound on</button>
    </div>
  </div>
</div>

<div id="result" class="overlay" hidden>
  <div class="card">
    <h2 class="result-title" id="result-title">Victory</h2>
    <p class="result-sub" id="result-sub"></p>
    <div class="result-coins"><span class="coin"></span><span id="result-coins">+0</span></div>
    <button class="play" id="continue" type="button">Next level</button>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
